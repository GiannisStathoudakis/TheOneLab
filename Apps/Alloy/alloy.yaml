apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.0
    helm:
      values: |
        controller:
          type: daemonset
          hostPID: true 
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet

          volumes:
            extra:
              - name: tetragon-logs
                hostPath:
                  path: /var/run/cilium/tetragon
              - name: host-proc
                hostPath:
                  path: /proc
              - name: host-sys
                hostPath:
                  path: /sys
              - name: host-root
                hostPath:
                  path: /

        alloy:
          stabilityLevel: generally-available
          
          clustering:
            enabled: true

          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP

          # -----------------------------------------------------------
          # DAEMONSET RESOURCE GUARDRAILS
          # -----------------------------------------------------------
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi

          securityContext:
            runAsUser: 0
            runAsGroup: 0

          rbac:
            create: true
          clusterRules:
            - apiGroups: [""]
              resources: ["nodes", "nodes/metrics", "nodes/proxy"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["pods", "pods/log", "namespaces", "services", "endpoints"]
              verbs: ["get", "list", "watch"]

          mounts:
            extra:
              - name: tetragon-logs
                mountPath: /var/log/tetragon
                readOnly: true
              - name: host-proc
                mountPath: /host/proc
                readOnly: true
              - name: host-sys
                mountPath: /host/sys
                readOnly: true
              - name: host-root
                mountPath: /host/root
                readOnly: true
                mountPropagation: HostToContainer

          configMap:
            content: |-
              // ==========================================
              // 1. Pod Discovery & Labels
              // ==========================================
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(env("HOSTNAME"), constants.hostname)
                }
              }

              discovery.relabel "pod_labels" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  action = "replace"
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_container_name"]
                  separator = ";"
                  regex = "^(?:;)*([^;]+).*$"
                  replacement = "$1"
                  target_label = "service_name"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "service_namespace"
                }
              }

              discovery.relabel "infra_pods" {
                targets = discovery.relabel.pod_labels.output
                rule {
                  source_labels = ["namespace"]
                  regex         = "ecommerce"
                  action        = "drop"
                }
              }

              // ==========================================
              // 2. Kubernetes Nodes (cAdvisor Pod Resource Metrics)
              // ==========================================
              prometheus.remote_write "mimir_infra" {
                endpoint {
                  url = "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"
                  headers = { "X-Scope-OrgID" = "infra" }
                }
              }

              prometheus.remote_write "mimir_app" {
                endpoint {
                  url = "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"
                  headers = { "X-Scope-OrgID" = "app" }
                }
              }

              discovery.kubernetes "nodes" { role = "node" }
              discovery.relabel "cadvisor" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  regex         = coalesce(env("HOSTNAME"), constants.hostname)
                  action        = "keep"
                }
              }
              prometheus.scrape "cadvisor" {
                targets             = discovery.relabel.cadvisor.output
                scheme              = "https"
                metrics_path        = "/metrics/cadvisor"
                bearer_token_file   = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config { insecure_skip_verify = true }
                forward_to = [prometheus.remote_write.mimir_infra.receiver] 
              }

              // ==========================================
              // 3. Loki Infrastructure Logs & Writers
              // ==========================================
              loki.source.kubernetes "infra_logs" {
                targets    = discovery.relabel.infra_pods.output
                forward_to = [loki.process.infra_logs_parse.receiver]
              }
              loki.process "infra_logs_parse" {
                forward_to = [loki.write.loki_infra.receiver]
                stage.multiline {
                  firstline = "^\\d{4}-\\d{2}-\\d{2}[T\\s]\\d{2}:\\d{2}:\\d{2}"
                  max_wait_time = "3s"
                  max_lines = 128
                }
                stage.json {
                  expressions = { level = "level" }
                  drop_malformed = false 
                }
                stage.regex {
                  expression = "^\\d{4}-\\d{2}-\\d{2}[T\\s]\\d{2}:\\d{2}:\\d{2}\\.\\d+Z?\\s+(?P<level>INFO|DEBUG|WARN|WARNING|ERROR|FATAL|TRACE)\\s+"
                }
                stage.labels {
                  values = { level = "level" }
                }
              }
              loki.write "loki_infra" {
                endpoint {
                  url = "http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push"
                  tenant_id = "infra"
                }
                wal {
                  enabled = true
                }
              }

              loki.write "loki_app" {
                endpoint {
                  url = "http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push"
                  tenant_id = "app"
                }
                wal {
                  enabled = true
                }
              }

              local.file_match "tetragon_logs" {
                path_targets = [{"__path__" = "/var/log/tetragon/tetragon.log"}]
              }
              loki.source.file "tetragon" {
                targets    = local.file_match.tetragon_logs.targets
                forward_to = [loki.process.tetragon_parse.receiver]
              }
              loki.process "tetragon_parse" {
                forward_to = [loki.write.loki_infra.receiver]
                stage.json {
                  expressions = {
                    pod       = "process.pod.name",
                    namespace = "process.pod.namespace",
                    event     = "process.event_type",
                    binary    = "process.binary",
                  }
                }
                stage.labels {
                  values = {
                    pod       = "pod",
                    namespace = "namespace",
                    event     = "event",
                    binary    = "binary",
                    log_type  = "tetragon_security",
                  }
                }
              }

              // ==========================================
              // 4. OTLP Pipeline (Traces, Metrics & App Logs)
              // ==========================================
              otelcol.receiver.otlp "default" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output {
                  traces  = [otelcol.processor.filter.drop_noise.input]
                  metrics = [otelcol.processor.transform.add_namespace.input]
                  logs    = [otelcol.processor.transform.map_log_level.input]
                }
              }

              otelcol.processor.transform "map_log_level" {
                error_mode = "ignore"
                log_statements {
                  context = "log"
                  statements = [
                    `set(attributes["level"], severity_text)`,
                    `set(attributes["loki.attribute.labels"], "level")`,
                    `set(resource.attributes["namespace"], resource.attributes["k8s.namespace.name"])`,
                    `set(resource.attributes["pod"], resource.attributes["k8s.pod.name"])`,
                    `set(resource.attributes["container"], resource.attributes["k8s.container.name"])`,
                    `set(resource.attributes["service_name"], resource.attributes["service.name"])`,
                    `set(resource.attributes["loki.resource.labels"], "namespace, pod, container, service_name")`,
                  ]
                }

                output {
                  logs = [otelcol.processor.batch.logs.input]
                }
              }

              otelcol.processor.filter "drop_noise" {
                error_mode = "ignore"
                traces {
                  span = [
                    `IsMatch(name, ".*actuator/health.*")`,
                    `IsMatch(attributes["http.target"], ".*actuator/health.*")`,
                    `IsMatch(attributes["url.path"], ".*actuator/health.*")`,
                    `attributes["http.target"] == "/health"`,
                    `attributes["http.target"] == "/ready"`,
                    `attributes["http.route"] == "/healthz"`,
                    `attributes["url.path"] == "/ready"`,
                    `attributes["url.path"] == "/healthz"`,
                  ]
                }
                output {
                  traces = [otelcol.processor.batch.traces.input] 
                }
              }

              otelcol.processor.transform "add_namespace" {
                error_mode = "ignore"
                metric_statements {
                  context = "datapoint"
                  statements = [
                    `set(datapoint.attributes["namespace"], resource.attributes["k8s.namespace.name"])`,
                    `set(datapoint.attributes["pod"], resource.attributes["k8s.pod.name"])`,
                    `set(datapoint.attributes["container"], resource.attributes["k8s.container.name"])`,
                  ]
                }
                output {
                  metrics = [otelcol.processor.batch.metrics.input]
                }
              }

              otelcol.processor.batch "traces" {
                output { traces = [otelcol.exporter.otlp.tempo.input] }
              }

              otelcol.processor.batch "metrics" {
                output { metrics = [otelcol.exporter.prometheus.to_mimir_app.input] }
              }

              otelcol.processor.batch "logs" {
                output { logs = [otelcol.exporter.loki.to_loki_app.input] }
              }

              otelcol.exporter.loki "to_loki_app" {
                forward_to = [loki.write.loki_app.receiver]
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo-distributor.tempo.svc.cluster.local:4317"
                  tls { insecure = true }
                }
              }

              otelcol.exporter.prometheus "to_mimir_app" {
                forward_to = [prometheus.remote_write.mimir_app.receiver]
              }

              // ==========================================
              // 5. Prometheus Service Discovery (Endpoints)
              // ==========================================
              discovery.kubernetes "endpoints" {
                role = "endpoints"
              }

              discovery.relabel "annotated_endpoints" {
                targets = discovery.kubernetes.endpoints.targets
                rule {
                  source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
                  regex         = "true"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_endpoint_node_name"]
                  regex         = coalesce(env("HOSTNAME"), constants.hostname)
                  action        = "keep"
                }
                rule {
                  source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
                  action        = "replace"
                  regex         = "([^:]+)(?::\\d+)?;(\\d+)"
                  replacement   = "$1:$2"
                  target_label  = "__address__"
                }
                rule {
                  source_labels = ["__meta_kubernetes_service_name"]
                  action        = "replace"
                  target_label  = "job"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  action        = "replace"
                  target_label  = "namespace"
                }
              }

              prometheus.scrape "annotated_endpoints" {
                targets    = discovery.relabel.annotated_endpoints.output
                forward_to = [prometheus.remote_write.mimir_infra.receiver]
              }

              // ==========================================
              // 6. Host/Node Metrics
              // ==========================================
              prometheus.exporter.unix "host" {
                procfs_path = "/host/proc"
                sysfs_path  = "/host/sys"
                rootfs_path = "/host/root"
              }

              prometheus.scrape "host_metrics" {
                targets    = prometheus.exporter.unix.host.targets
                forward_to = [prometheus.relabel.host_metrics.receiver]
              }

              prometheus.relabel "host_metrics" {
                forward_to = [prometheus.remote_write.mimir_infra.receiver]

                rule {
                  target_label = "instance"
                  replacement  = coalesce(env("HOSTNAME"), constants.hostname)
                }
                rule {
                  target_label = "job"
                  replacement  = "node-exporter"
                }
                rule {
                  target_label = "job_name"
                  replacement  = "integrations/node-exporter"
                }
                rule {
                  action = "labeldrop"
                  regex = "server"
                }
              }

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true