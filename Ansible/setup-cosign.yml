---
- name: Automate Cosign Installation and Vault Storage
  hosts: master
  vars:
    cosign_version: "v3.1.3"
    cosign_dir: "/tmp/cosign_build"
    vault_secret_path: "secret/cosign"

  tasks:
    - name: Download Cosign binary
      become: true
      get_url:
        url: "https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-amd64"
        dest: "/usr/local/bin/cosign"
        mode: '0755'

    - name: Check if Cosign keys already exist in Vault
      command: kubectl exec -n vault vault-0 -- vault kv get {{ vault_secret_path }}
      register: vault_check
      ignore_errors: true
      changed_when: false

    - name: Create temporary directory for Cosign
      file:
        path: "{{ cosign_dir }}"
        state: directory
        mode: '0700'
      when: vault_check.rc != 0

    - name: Generate a random 32-character password for the private key
      set_fact:
        cosign_pass: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
      when: vault_check.rc != 0

    - name: Generate Cosign keypair
      command: cosign generate-key-pair
      args:
        chdir: "{{ cosign_dir }}"
      environment:
        COSIGN_PASSWORD: "{{ cosign_pass | default('') }}"
      when: vault_check.rc != 0

    - name: Read Private Key into memory
      slurp:
        src: "{{ cosign_dir }}/cosign.key"
      register: private_key_file
      when: vault_check.rc != 0

    - name: Read Public Key into memory
      slurp:
        src: "{{ cosign_dir }}/cosign.pub"
      register: public_key_file
      when: vault_check.rc != 0

    - name: Create Vault JSON payload
      copy:
        dest: "/tmp/cosign_vault_payload.json"
        content: |
          {
            "private_key": {{ private_key_file.content | b64decode | to_json }},
            "public_key": {{ public_key_file.content | b64decode | to_json }},
            "password": "{{ cosign_pass | default('') }}"
          }
        mode: '0600'
      when: vault_check.rc != 0

    - name: Copy JSON payload into the Vault
      command: kubectl cp /tmp/cosign_vault_payload.json vault/vault-0:/tmp/cosign.json
      when: vault_check.rc != 0

    - name: Write Cosign secrets to Vault
      command: kubectl exec -n vault vault-0 -- vault kv put {{ vault_secret_path }} @/tmp/cosign.json
      when: vault_check.rc != 0

    - name: Clean up
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/cosign_vault_payload.json"
        - "{{ cosign_dir }}"