apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: rancher-bootstrap-secret
  namespace: cattle-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bootstrap-secret
  data:
  - secretKey: bootstrapPassword
    remoteRef:
      key: secret/rancher
      property: bootstrap