---
- hosts: master
  become: true
  vars_files:
    - files/secrets.yml
  vars:
    kubeconfig_path: "/etc/rancher/rke2/rke2.yaml"

  tasks:
    - name: 00. Install required Python libraries on Master host
      ansible.builtin.apt:
        name: 
          - python3-kubernetes
          - python3-yaml
        state: present
        update_cache: yes

    - name: 01. Install Local Path Provisioner
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml

    - name: 02. Make local-path the default StorageClass
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: local-path
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
    
    - name: 03. Install gateway-api
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.0/experimental-install.yaml

    - name: 04. Add Cilium Helm repo
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: https://helm.cilium.io/

    - name: 05. Install Cilium CNI via Helm
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: cilium
        chart_ref: cilium/cilium
        release_namespace: kube-system
        state: present
        wait: true
        timeout: 10m0s 
        values:
          kubeProxyReplacement: "true"
          k8sServiceHost: "{{ master_ip }}"
          k8sServicePort: 6443
          operator:
            replicas: 1
          encryption:
            enabled: true
            type: wireguard