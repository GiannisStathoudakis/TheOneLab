apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: 'https://github.com/GiannisStathoudakis/TheOneLab.git'
    path: 'Policies'
    targetRevision: master
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true