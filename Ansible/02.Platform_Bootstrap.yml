---
- hosts: master
  vars_files:
    - files/secrets.yml

  tasks:
    - name: 01. Install required Python libraries on Master host
      become: true
      ansible.builtin.apt:
        name: 
          - python3-kubernetes
          - python3-yaml
        state: present
        update_cache: yes

    - name: 02. Add OpenEBS Helm Repository
      kubernetes.core.helm_repository:
        name: openebs
        repo_url: https://openebs.github.io/openebs

    - name: 03. Install OpenEBS via Helm (GitOps Aligned)
      kubernetes.core.helm:
        name: openebs
        chart_ref: openebs/openebs
        chart_version: "4.5.1"
        release_namespace: openebs
        create_namespace: true
        state: present
        values:
          engines:
            local:
              lvm:
                enabled: true
              zfs:
                enabled: false
              rawfile:
                enabled: false
              hostpath:
                enabled: false
            replicated:
              mayastor:
                enabled: false
          lvm-localpv:
            nodeSelector:
              node-role.kubernetes.io/control-plane: "true"
          loki:
            enabled: false
          alloy:
            enabled: false
      
    - name: 04. Create default StorageClass for OpenEBS LVM
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: openebs-lvm
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: local.csi.openebs.io
          parameters:
            storage: "lvm"
            volgroup: "lvmvg"
    
    - name: 05. Install gateway-api
      kubernetes.core.k8s:
        state: present
        src: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.0/experimental-install.yaml

    - name: 06. Copy CoreDNS HelmChartConfig to RKE2 Manifests
      become: true
      ansible.builtin.copy:
        src: files/configure-coredns.yaml
        dest: /var/lib/rancher/rke2/server/manifests/rke2-coredns-config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: 07. Force CoreDNS to reload configuration immediately
      ansible.builtin.shell: kubectl rollout restart deployment rke2-coredns-rke2-coredns -n kube-system
      changed_when: true

    - name: 08. Add Helm Repositories (Cilium & ArgoCD)
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: 'cilium', url: 'https://helm.cilium.io/' }
        - { name: 'argo', url: 'https://argoproj.github.io/argo-helm' }

    - name: 09. Install Cilium CNI via Helm
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        chart_version: "1.19.5"
        release_namespace: kube-system
        state: present
        wait: true
        timeout: 10m0s 
        values:
          kubeProxyReplacement: "true"
          k8sServiceHost: "{{ master_ip }}"
          k8sServicePort: 6443
          operator:
            replicas: 1
          encryption:
            enabled: true
            type: wireguard
    
    - name: 10. Create Argo CD namespace
      kubernetes.core.k8s:
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    - name: 11. Install Argo CD via Helm
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        chart_version: "10.1.2"
        release_namespace: argocd
        state: present
        wait: true

    - name: 12. Retrieve Argo CD initial admin password
      kubernetes.core.k8s_info:
        kind: Secret
        name: argocd-initial-admin-secret
        namespace: argocd
      register: argocd_secret

    - name: 13. Print Argo CD password
      ansible.builtin.debug:
        msg: "Argo CD Password: {{ argocd_secret.resources[0].data.password | b64decode }}"

    - name: 14. Add Private GitHub Repository to Argo CD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: theonelab-repo-secret
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            name: "GitHub"
            type: "git"
            url: "git@github.com:GiannisStathoudakis/TheOneLab.git"
            project: "default"
            sshPrivateKey: "{{ github_ssh_private_key }}"
    
    - name: 15. Trigger GitOps Apply Root Application
      kubernetes.core.k8s:
        state: present
        src: "https://raw.githubusercontent.com/GiannisStathoudakis/TheOneLab/main/Bootstrap/root.yaml?v=3"

#kubectl port-forward svc/argocd-server -n argocd 8080:443 --address 0.0.0.0