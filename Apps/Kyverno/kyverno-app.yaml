apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      values: |
        admissionController:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
              
        # Disable the heavy background processes
        backgroundController:
          enabled: false
        reportsController:
          enabled: false
        cleanupController:
          enabled: false
          
        features:
          admissionReports:
            enabled: false
          aggregateReports:
            enabled: false
          policyReports:
            enabled: false
          validatingAdmissionPolicyReports:
            enabled: false
          backgroundScan:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true