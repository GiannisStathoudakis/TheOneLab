apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-dojo-report-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://telekom-mms.github.io/trivy-dojo-report-operator
    chart: trivy-dojo-report-operator
    targetRevision: 0.11.0
    helm:
      values: |
        defectDojoApiCredentials:
          url: "http://defectdojo-django.defectdojo.svc.cluster.local"
          apiKey: "managed-by-external-secrets" 

        operator:
          replicas: 1
          trivyDojoReportOperator:
            image:
              repository: ghcr.io/telekom-mms/docker-trivy-dojo-operator
              tag: 0.2.3
            env:
              defectDojoActive: "true"
              defectDojoAutoCreateContext: "true"
              defectDojoCloseOldFindings: "false"
              defectDojoCloseOldFindingsProductScope: "false"
              defectDojoDeduplicationOnEngagement: "true"
              defectDojoMinimumSeverity: Info
              defectDojoVerified: "false"
              defectDojoEngagementName: 'Trivy Operator'
              defectDojoEvalTestTitle: "true"
              defectDojoEvalProductName: "true"
              defectDojoEvalProductTypeName: "true"
              defectDojoTestTitle: 'f"{body[\"report\"][\"artifact\"][\"repository\"]}:{body[\"report\"][\"artifact\"][\"tag\"]}"'
              defectDojoProductName: 'meta["labels"]["trivy-operator.resource.name"]'
              defectDojoProductTypeName: 'meta["namespace"]'
            

  destination:
    server: https://kubernetes.default.svc
    namespace: defectdojo-report 
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: trivy-dojo-report-operator
      jsonPointers:
        - /data
        
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true