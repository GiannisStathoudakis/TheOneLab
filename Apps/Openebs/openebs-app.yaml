apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://openebs.github.io/openebs
    chart: openebs
    targetRevision: 4.5.1
    helm:
      values: |
        engines:
          local:
            lvm:
              enabled: true
            zfs:
              enabled: false
            rawfile:
              enabled: false
            hostpath:
              enabled: false
          replicated:
            mayastor:
              enabled: false
              
        lvm-localpv:
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"

        loki:
          enabled: false
        alloy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true