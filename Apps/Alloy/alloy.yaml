apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.10.0
    helm:
      values: |
        controller:
          type: daemonset
          hostPID: true # Required for Pyroscope eBPF stack sampling

        alloy:
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          # ----------------------

          securityContext:
            privileged: true # Required for eBPF and hostPath log tailing

          rbac:
            create: true
          extraClusterRoleRules:
            - apiGroups: [""]
              resources: ["pods", "pods/log", "nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints"]
              verbs: ["get", "list", "watch"]

          # Mount Tetragon host log directory into Alloy
          extraVolumes:
            - name: tetragon-logs
              hostPath:
                path: /var/run/cilium/tetragon
          extraVolumeMounts:
            - name: tetragon-logs
              mountPath: /var/log/tetragon
              readOnly: true

          configMap:
            content: |-
              // ==========================================
              // 1. VictoriaMetrics (cAdvisor Pod Resource Metrics)
              // ==========================================
              discovery.kubernetes "nodes" {
                role = "node"
              }

              discovery.relabel "cadvisor" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  regex         = coalesce(env("HOSTNAME"), constants.hostname)
                  action        = "keep"
                }
              }

              prometheus.scrape "cadvisor" {
                targets             = discovery.relabel.cadvisor.output
                scheme              = "https"
                metrics_path        = "/metrics/cadvisor"
                bearer_token_file   = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to = [prometheus.remote_write.victoriametrics.receiver]
              }

              prometheus.remote_write "victoriametrics" {
                endpoint {
                  url = "http://victoria-metrics-server.victoria.svc.cluster.local:8428/api/v1/write"
                }
              }

              // ==========================================
              // 2. Loki (Pod Stdout/Stderr Application Logs) - FIXED
              // ==========================================
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(env("HOSTNAME"), constants.hostname)
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  action = "replace"
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_container_name"]
                  separator = ";"
                  regex = "^(?:;)*([^;]+).*$"
                  replacement = "$1"
                  target_label = "service_name"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.loki.receiver]
              }

              // ==========================================
              // 3. Loki (Tetragon eBPF Security Logs)
              // ==========================================
              local.file_match "tetragon_logs" {
                path_targets = [{"__path__" = "/var/log/tetragon/tetragon.log"}]
              }

              loki.source.file "tetragon" {
                targets    = local.file_match.tetragon_logs.targets
                forward_to = [loki.process.tetragon_parse.receiver]
              }

              loki.process "tetragon_parse" {
                forward_to = [loki.write.loki.receiver]

                stage.json {
                  expressions = {
                    pod       = "process.pod.name",
                    namespace = "process.pod.namespace",
                    event     = "process.event_type",
                    binary    = "process.binary",
                  }
                }

                stage.labels {
                  values = {
                    pod       = "pod",
                    namespace = "namespace",
                    event     = "event",
                    binary    = "binary",
                    log_type  = "tetragon_security",
                  }
                }
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              // ==========================================
              // 4. Pyroscope (eBPF Continuous Profiling)
              // ==========================================
              pyroscope.ebpf "default" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [pyroscope.write.pyroscope.receiver]
              }

              pyroscope.write "pyroscope" {
                endpoint {
                  url = "http://pyroscope.pyroscope.svc.cluster.local:4040"
                }
              }

              // ==========================================
              // 5. Tempo & OTLP Pipeline (Traces & Beyla Metrics)
              // ==========================================
              otelcol.receiver.otlp "default" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output {
                  traces  = [otelcol.processor.batch.default.input]
                  metrics = [otelcol.processor.batch.default.input]
                }
              }

              otelcol.processor.batch "default" {
                output {
                  traces  = [otelcol.exporter.otlp.tempo.input]
                  metrics = [otelcol.exporter.prometheus.to_victoriametrics.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.tempo.svc.cluster.local:4317"
                  tls {
                    insecure = true
                  }
                }
              }

              otelcol.exporter.prometheus "to_victoriametrics" {
                forward_to = [prometheus.remote_write.victoriametrics.receiver]
              }

              // ==========================================
              // 6. Prometheus Service Discovery (Endpoints)
              // ==========================================
              discovery.kubernetes "endpoints" {
                role = "endpoints"
              }

              discovery.relabel "annotated_endpoints" {
                targets = discovery.kubernetes.endpoints.targets

                rule {
                  source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
                  regex         = "true"
                  action        = "keep"
                }
                
                rule {
                  source_labels = ["__meta_kubernetes_endpoint_node_name"]
                  regex         = coalesce(env("HOSTNAME"), constants.hostname)
                  action        = "keep"
                }

                rule {
                  source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
                  action        = "replace"
                  regex         = "([^:]+)(?::\\d+)?;(\\d+)"
                  replacement   = "$1:$2"
                  target_label  = "__address__"
                }

                rule {
                  source_labels = ["__meta_kubernetes_service_name"]
                  action        = "replace"
                  target_label  = "job"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  action        = "replace"
                  target_label  = "namespace"
                }
              }

              prometheus.scrape "annotated_endpoints" {
                targets    = discovery.relabel.annotated_endpoints.output
                forward_to = [prometheus.remote_write.victoriametrics.receiver]
              }

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true