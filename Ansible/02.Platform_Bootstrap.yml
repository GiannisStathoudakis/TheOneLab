---
- hosts: master
  vars_files:
    - files/secrets.yml

  tasks:
    - name: 01. Install required Python libraries on Master host
      become: true
      ansible.builtin.apt:
        name: 
          - python3-kubernetes
          - python3-yaml
        state: present
        update_cache: yes

    - name: 02. Install Local Path Provisioner
      kubernetes.core.k8s:
        state: present
        src: https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml

    - name: 03. Make local-path the default StorageClass
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: local-path
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
    
    - name: 04. Install gateway-api
      kubernetes.core.k8s:
        state: present
        src: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.0/experimental-install.yaml

    - name: 05. Copy CoreDNS HelmChartConfig to RKE2 Manifests
      become: true
      ansible.builtin.copy:
        src: files/configure-coredns.yaml
        dest: /var/lib/rancher/rke2/server/manifests/rke2-coredns-config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: 06. Force CoreDNS to reload configuration immediately
      ansible.builtin.shell: kubectl rollout restart deployment rke2-coredns-rke2-coredns -n kube-system
      changed_when: true

    - name: 07. Add Helm Repositories (Cilium & ArgoCD)
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: 'cilium', url: 'https://helm.cilium.io/' }
        - { name: 'argo', url: 'https://argoproj.github.io/argo-helm' }

    - name: 08. Install Cilium CNI via Helm
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        release_namespace: kube-system
        state: present
        wait: true
        timeout: 10m0s 
        values:
          kubeProxyReplacement: "true"
          k8sServiceHost: "{{ master_ip }}"
          k8sServicePort: 6443
          operator:
            replicas: 1
          encryption:
            enabled: true
            type: wireguard
    
    - name: 09. Create Argo CD namespace
      kubernetes.core.k8s:
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    - name: 10. Install Argo CD via Helm
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: argocd
        state: present
        wait: true

    - name: 11. Retrieve Argo CD initial admin password
      kubernetes.core.k8s_info:
        kind: Secret
        name: argocd-initial-admin-secret
        namespace: argocd
      register: argocd_secret

    - name: 12. Print Argo CD password
      ansible.builtin.debug:
        msg: "Argo CD Password: {{ argocd_secret.resources[0].data.password | b64decode }}"

    - name: 13. Add Private GitHub Repository to Argo CD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: theonelab-repo-secret
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            name: "GitHub"
            type: "git"
            url: "git@github.com:GiannisStathoudakis/TheOneLab.git"
            project: "default"
            sshPrivateKey: "{{ github_ssh_private_key }}"
    
    - name: 14. Trigger GitOps! Apply Root Application
      kubernetes.core.k8s:
        state: present
        src: "https://raw.githubusercontent.com/GiannisStathoudakis/TheOneLab/master/Bootstrap/root.yaml?v=3"