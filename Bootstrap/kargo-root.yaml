apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GiannisStathoudakis/springboot-kafka-streams-microservices-demo
    targetRevision: master
    path: chart 
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true