apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 2.2.3
    helm:
      values: |
        tempo:
          # Delete traces after 1 week
          retention: 168h 

          metricsGenerator:
            enabled: true
            remoteWriteUrl: "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"

          extraEnvFrom:
            - secretRef:
                name: tempo-s3-credentials
          
          storage:
            trace:
              backend: s3
              s3:
                bucket: tempo-traces
                endpoint: garage.garage.svc.cluster.local:3900
                region: garage
                insecure: true
                forcepathstyle: true
        
        livenessProbe:
          initialDelaySeconds: 60
        readinessProbe:
          initialDelaySeconds: 60
                
  destination:
    server: https://kubernetes.default.svc
    namespace: tempo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true