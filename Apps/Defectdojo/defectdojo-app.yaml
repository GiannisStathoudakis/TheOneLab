apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: defectdojo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts
    chart: defectdojo
    targetRevision: 1.9.52 
    helm:
      values: |
        host: defectdojo.kublab.org
        siteUrl: "https://defectdojo.kublab.org"
        
        alternativeHosts:
          - defectdojo-django.defectdojo.svc.cluster.local
          
        django:
          ingress:
            enabled: false
          uwsgi:
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

        celery:
          worker:
            replicas: 1
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
          beat:
            replicas: 1

        postgresql:
          enabled: true
          architecture: standalone
          auth:
            username: defectdojo
            database: defectdojo
            existingSecret: defectdojo-core-secrets
            secretKeys:
              userPasswordKey: dbPassword
          primary:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi

        valkey:
          enabled: true
          architecture: standalone
          auth:
            existingSecret: defectdojo-core-secrets
            existingSecretPasswordKey: valkeyPassword
          primary:
            resources:
              limits:
                memory: 128Mi

        initializer:
          run: true
          keepSeconds: 60
        admin:
          password: ""

        extraConfigs:
          DD_SOCIAL_AUTH_KEYCLOAK_ENABLED: 'true'

        extraEnv:
          - name: DD_DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: defectdojo-core-secrets
                key: dbPassword
          - name: DD_CELERY_BROKER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: defectdojo-core-secrets
                key: valkeyPassword
          - name: DD_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: defectdojo-core-secrets
                key: djangoSecretKey
          - name: DD_CREDENTIAL_AES_256_KEY
            valueFrom:
              secretKeyRef:
                name: defectdojo-core-secrets
                key: djangoCredentialKey
          - name: DD_SOCIAL_AUTH_KEYCLOAK_KEY
            valueFrom:
              secretKeyRef:
                name: defectdojo-core-secrets
                key: clientID
          - name: DD_SOCIAL_AUTH_KEYCLOAK_SECRET
            valueFrom:
              secretKeyRef:
                name: defectdojo-core-secrets
                key: clientSecret
          - name: DD_SOCIAL_AUTH_KEYCLOAK_PUBLIC_KEY
            value: "https://authentik.kublab.org/application/o/defectdojo/"

        localsettingspy: |
          SOCIAL_AUTH_KEYCLOAK_EXTRA_DATA = ['groups']
          def map_authentik_roles(backend, details, response, user, *args, **kwargs):
              if not user:
                  return
              groups = response.get('groups', [])
              if 'authentik Admins' in groups:
                  user.is_superuser = True
                  user.is_staff = True
              else:
                  user.is_superuser = False
                  user.is_staff = False
              user.save()
          SOCIAL_AUTH_PIPELINE = (
              'social_core.pipeline.social_auth.social_details',
              'social_core.pipeline.social_auth.social_uid',
              'social_core.pipeline.social_auth.auth_allowed',
              'social_core.pipeline.social_auth.social_user',
              'social_core.pipeline.user.get_username',
              'social_core.pipeline.user.create_user',
              'social_core.pipeline.social_auth.associate_user',
              'social_core.pipeline.social_auth.load_extra_data',
              'social_core.pipeline.user.user_details',
              'dojo.settings.local_settings.map_authentik_roles',
          )
  destination:
    server: https://kubernetes.default.svc
    namespace: defectdojo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true