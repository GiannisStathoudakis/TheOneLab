---
apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: defectdojo-oidc-es
  namespace: defectdojo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: defectdojo-oidc-secret
  data:
  - secretKey: clientID
    remoteRef:
      key: secret/defectdojo
      property: clientId
  - secretKey: clientSecret
    remoteRef:
      key: secret/defectdojo
      property: clientSecret