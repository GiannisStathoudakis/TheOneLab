apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    targetRevision: 6.2.0
    helm:
      values: |
        global:
          extraEnvFrom:
            - secretRef:
                name: mimir-s3-credentials

        kafka:
          enabled: false 

        mimir:
          structuredConfig:
            ingest_storage:
              enabled: false
            ingester:
              push_grpc_method_enabled: true
              ring:
                replication_factor: 1
            blocks_storage:
              backend: s3
              s3:
                endpoint: garage.garage.svc.cluster.local:3900
                region: garage
                bucket_name: mimir-blocks
                access_key_id: ${AWS_ACCESS_KEY_ID}
                secret_access_key: ${AWS_SECRET_ACCESS_KEY}
                insecure: true
            ruler_storage:
              backend: s3
              s3:
                endpoint: garage.garage.svc.cluster.local:3900
                region: garage
                bucket_name: mimir-ruler
                access_key_id: ${AWS_ACCESS_KEY_ID}
                secret_access_key: ${AWS_SECRET_ACCESS_KEY}
                insecure: true
                
            #alertmanager_storage:
            #  backend: s3
            #  s3:
            #    endpoint: garage.garage.svc.cluster.local:3900
            #    region: garage
            #    bucket_name: mimir-alertmanager
            #    access_key_id: ${AWS_ACCESS_KEY_ID}
            #    secret_access_key: ${AWS_SECRET_ACCESS_KEY}
            #    insecure: true
            #alertmanager:
            #  fallback_config_file: /etc/alertmanager-fallback/alertmanager.yaml

        minio:
          enabled: false
        gateway:
          enabled: false
        rollout_operator:
          enabled: false
        alertmanager:
          enabled: false
          
        #alertmanager:
        #  replicas: 1
        #  statefulSet:
        #    enabled: true
        #  fallbackConfig: "" 
        #  extraVolumes:
        #    - name: alertmanager-fallback
        #      secret:
        #        secretName: alertmanager-fallback-config
        #  extraVolumeMounts:
        #    - name: alertmanager-fallback
        #      mountPath: /etc/alertmanager-fallback
        #      readOnly: true

        ingester:
          replicas: 1
          zoneAwareReplication:
            enabled: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi

        store_gateway:
          replicas: 1
          zoneAwareReplication:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi

        compactor:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi

        distributor:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

        querier:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi

        query_frontend:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

        query_scheduler:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

        ruler:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

        overrides_exporter:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        chunks-cache:
          enabled: true
          replicas: 1
          allocatedMemory: 512  # Overriding the insane 8192MB default
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 768Mi

        index-cache:
          enabled: true
          replicas: 1
          allocatedMemory: 512  # Overriding the default 2048MB
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 768Mi

        metadata-cache:
          enabled: true
          replicas: 1
          allocatedMemory: 256  # Overriding the default 512MB
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi

        results-cache:
          enabled: true
          replicas: 1
          allocatedMemory: 256
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: mimir
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true