---
apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: defectdojo-core-es
  namespace: defectdojo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: defectdojo
  data:
  - secretKey: DD_SECRET_KEY
    remoteRef:
      key: secret/defectdojo
      property: djangoSecretKey
  - secretKey: DD_CREDENTIAL_AES_256_KEY
    remoteRef:
      key: secret/defectdojo
      property: djangoCredentialKey
  - secretKey: METRICS_HTTP_AUTH_PASSWORD
    remoteRef:
      key: secret/defectdojo
      property: djangoSecretKey

---
apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: defectdojo-pg-es
  namespace: defectdojo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: defectdojo-postgresql-specific
  data:
  - secretKey: postgresql-password
    remoteRef:
      key: secret/defectdojo
      property: dbPassword
  - secretKey: postgresql-postgres-password
    remoteRef:
      key: secret/defectdojo
      property: dbPassword

---
apiVersion: external-secrets.io/v1 
