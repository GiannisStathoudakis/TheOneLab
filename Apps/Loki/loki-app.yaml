apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.13.5
    helm:
      values: |
        global:
          extraEnvFrom:
            - secretRef:
                name: loki-s3-credentials

        deploymentMode: SimpleScalable

        loki:
          auth_enabled: true
          
          commonConfig:
            replication_factor: 1
            
          storage:
            type: s3
            bucketNames:
              chunks: loki-logs
              ruler: loki-logs
              admin: loki-logs
            s3:
              endpoint: garage.garage.svc.cluster.local:3900
              region: garage
              insecure: true
              s3ForcePathStyle: true

          compactor:
            working_directory: /var/loki/compactor
            compaction_interval: 10m
            retention_enabled: true
            retention_delete_delay: 2h
            retention_delete_worker_count: 150
            delete_request_store: s3

          limits_config:
            retention_period: 8760h 
            retention_stream:
              - selector: '{level=~"info|debug|trace"}'
                priority: 1
                period: 336h
              - selector: '{log_type="tetragon_security"}'
                priority: 2
                period: 8760h
          
          schemaConfig:
            configs:
              - from: "2026-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

        singleBinary:
          replicas: 0
          
        write:
          replicas: 1
          persistence:
            size: 5Gi
            storageClass: openebs-lvm
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi

        read:
          replicas: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi

        backend:
          replicas: 1
          persistence:
            size: 5Gi
            storageClass: openebs-lvm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        chunksCache:
          enabled: true
          allocatedMemory: 512
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

        resultsCache:
          enabled: true
          allocatedMemory: 512
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

        minio:
          enabled: false

        gateway:
          enabled: false
          
        lokiCanary:
          enabled: false
          
        test:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true