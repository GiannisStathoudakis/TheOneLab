apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: renovate-token-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renovate-token
  data:
  - secretKey: token
    remoteRef:
      key: secret/renovate
      property: token